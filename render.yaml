services:
  - type: web
    name: tasmia
    runtime: go
    plan: free
    region: frankfurt
    buildCommand: cd web/backend && go build -o tasmia ./cmd
    startCommand: TASMIA_CONFIG=config.render.json ./web/backend/tasmia
    healthCheckPath: /api/health
    envVars:
      - key: TASMIA_AI_URL
        value: https://dr-pisto-tasmia-live.hf.space
